[project]
name = "embeddings-quantizer"
version = "1.0.0"
description = "Vector quantization toolkit (SQ8, 1-bit Binary, and Product Quantization with ADC search)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "numpy>=1.26.0",
    "uvicorn>=0.52.3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=9.1.1",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
